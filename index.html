<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <div class="lists-topbar">
            <div class="title-wrap">
                <h1>Lists</h1>
            </div>

            <nav class="list-tabs" aria-label="Lists navigation">
                <button class="tab active" type="button">Subscribed to</button>
                <button class="tab" type="button">Member of</button>
            </nav>
        </div>

        <div class="empty-state">
            <div class="empty-state-inner">
                <p class="p1">You haven't subscribed to any lists yet.</p>
                <p class="p2">When you subscribe to lists, they'll appear here.</p>
                <button class="create-list" type="button">Create a list</button>
            </div>

            <button class="floating-button" type="button" aria-label="Find lists">
                <span class="floating-icon">D</span>
            </button>
        </div>
    </div>
</body>
</html>
